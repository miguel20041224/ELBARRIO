services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: elbarrio
      POSTGRES_PASSWORD: elbarrio
      POSTGRES_DB: elbarrio
    ports:
      - "5432:5432"
    volumes:
      - elbarrio_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elbarrio"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql://elbarrio:elbarrio@db:5432/elbarrio
      # El origen es el del navegador del anfitrión, no el del contenedor.
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:8000/api
    ports:
      - "5173:5173"

volumes:
  elbarrio_db:
